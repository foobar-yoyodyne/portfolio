<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>D-01-05 — Laymic Test</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/laymic@2.2.2/dist/laymic.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1 class="site-title">D-01-05</h1>
    <p class="site-subtitle">Laymic test page</p>
  </header>

  <main>
    <section class="test-panel">
      <h1>Laymic test</h1>
      <p>1700 × 2400 px の原稿を使って表示・ズーム動作を確認します。</p>

      <a class="laymic_opener" data-for="manga1" href="#manga1">総集編を読む</a>

      <div class="laymic_template" data-viewer-id="manga1" id="manga1">
        <!-- Test manuscript: place 1700×2400 PNG files at manga/test/001.png etc. -->
        <img data-src="manga/test/001.png" alt="D-01-05 page 1">
        <img data-src="manga/test/002.png" alt="D-01-05 page 2">
        <img data-src="manga/test/003.png" alt="D-01-05 page 3">
        <img data-src="manga/test/004.png" alt="D-01-05 page 4">
        <img data-src="manga/test/005.png" alt="D-01-05 page 5">
        <img data-src="manga/test/006.png" alt="D-01-05 page 6">
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/laymic@2.2.2/dist/laymic.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
