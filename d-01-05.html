<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>D-01-05 — Laymic Test</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/laymic@2.2.2/dist/laymic.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1 class="site-title">D-01-05</h1>
    <p class="site-subtitle">Laymic test page</p>
  </header>

  <main>
    <section class="test-panel">
      <h1>Laymic test</h1>
      <p>Original Blogger test images hosted on Imgur. Image dimensions: 1700 × 2400 px.</p>

      <div class="laymic_template" data-viewer-id="manga1">
        <img data-src="https://i.imgur.com/TumbQDB.png" /> 
        <img data-src="https://i.imgur.com/BD26vwr.png" />   
        <img data-src="https://i.imgur.com/2emNEXD.png" /> 
        <img data-src="https://i.imgur.com/ER3e8M8.png" /> 
        <img data-src="https://i.imgur.com/40DAL13.png" /> 
        <img data-src="https://i.imgur.com/4MU12KL.png" /> 
      </div>
      
      <button class="laymic_opener" data-for="manga1" type="button"><span style="font-family: Noto Sans JP;">
        総集編を読む
      </span></button>
    </section>
  </main>

<!--laymic.js v2.2.2 - github.com/dettalant/laymic-->
<script src="https://cdn.jsdelivr.net/npm/@dettalant/laymic@2.2.2/dist/laymic.iife.min.js"></script>
<script>
  new laymic.LaymicApplicator(".laymic_template", {
    // 原稿画像横幅
    pageWidth: 1700,
    // 原稿画像縦幅
    pageHeight: 2400,
  })
</script>

</body>
</html>
